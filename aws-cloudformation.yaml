AWSTemplateFormatVersion: '2010-09-09'
Description: 'PubThis - Self-hosted artifact publishing server on EC2 Free Tier'

Parameters:
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: 'Name of an existing EC2 KeyPair for SSH access'
  
  YourIP:
    Type: String
    Default: '0.0.0.0/0'
    Description: 'Your IP address for SSH access (e.g. 123.45.67.89/32). Use 0.0.0.0/0 to allow from anywhere (less secure).'

Resources:

  # Security Group - The Firewall
  PubThisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Security group for PubThis server'
      SecurityGroupIngress:
        # Allow HTTP (port 80) from anywhere
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: '0.0.0.0/0'
        # Allow HTTPS (port 443) from anywhere
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: '0.0.0.0/0'
        # Allow SSH (port 22) only from your IP
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref YourIP
        # Allow the app port (3000) from anywhere
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: '0.0.0.0/0'
      Tags:
        - Key: Name
          Value: pubthis-sg

  # EC2 Instance - The Server
  PubThisServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro  # Free Tier eligible!
      ImageId: !FindInMap [RegionAMI, !Ref 'AWS::Region', AMI]
      KeyName: !Ref KeyPairName
      SecurityGroups:
        - !Ref PubThisSecurityGroup
      Tags:
        - Key: Name
          Value: pubthis-server
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e

          # Update system
          sudo apt-get update -y
          sudo apt-get upgrade -y

          # Install Node.js 22 LTS
          curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
          sudo apt-get install -y nodejs

          # Install Git
          sudo apt-get install -y git

          # Install PM2 (keeps your app running forever, even after reboot)
          sudo npm install -g pm2

          # Clone YOUR repository
          cd /home/ubuntu
          git clone https://github.com/RyanChen1002/RyanChen-pubthis.git
          cd RyanChen-pubthis

          # Install dependencies
          npm install

          # Start the app with PM2
          pm2 start npm --name "pubthis" -- run start
          pm2 save
          pm2 startup systemd -u ubuntu --hp /home/ubuntu

          # Install Nginx as a reverse proxy (maps port 80 -> 3000)
          sudo apt-get install -y nginx
          sudo tee /etc/nginx/sites-available/pubthis > /dev/null <<'EOF'
          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_cache_bypass $http_upgrade;
              }
          }
          EOF

          sudo ln -sf /etc/nginx/sites-available/pubthis /etc/nginx/sites-enabled/pubthis
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo systemctl restart nginx

  # Elastic IP - Gives your server a permanent public IP address
  PubThisElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      InstanceId: !Ref PubThisServer
      Tags:
        - Key: Name
          Value: pubthis-ip

# AMI Map - Ubuntu 22.04 LTS images per region
Mappings:
  RegionAMI:
    us-east-1:
      AMI: ami-0c7217cdde317cfec
    us-east-2:
      AMI: ami-05fb0b8c1424f266b
    us-west-1:
      AMI: ami-0ce2cb35386fc22e9
    us-west-2:
      AMI: ami-008fe2fc65df48dac
    eu-west-1:
      AMI: ami-0905a3c97561e0b69
    eu-central-1:
      AMI: ami-0faab6bdbac9486fb
    ap-southeast-1:
      AMI: ami-078c1149d8ad719a7
    ap-northeast-1:
      AMI: ami-07c589821f2b353aa

Outputs:
  PublicIP:
    Description: 'Your PubThis server public IP address'
    Value: !Ref PubThisElasticIP
  
  WebsiteURL:
    Description: 'Your PubThis website URL'
    Value: !Sub 'http://${PubThisElasticIP}'
  
  SSHCommand:
    Description: 'SSH command to connect to your server'
    Value: !Sub 'ssh -i your-key.pem ubuntu@${PubThisElasticIP}'
