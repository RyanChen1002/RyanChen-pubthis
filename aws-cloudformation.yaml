AWSTemplateFormatVersion: '2010-09-09'
Description: 'PubThis - Self-hosted artifact publishing server on EC2 Free Tier'

Parameters:
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: 'Name of an existing EC2 KeyPair for SSH access'
  
  YourIP:
    Type: String
    Default: '0.0.0.0/0'
    Description: 'Your IP address for SSH access (e.g. 123.45.67.89/32). Use 0.0.0.0/0 to allow from anywhere.'

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: '/aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id'
    Description: 'Auto-resolves the latest Ubuntu 22.04 AMI for your region'

Resources:

  # ---- NETWORKING ----

  PubThisVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: '10.0.0.0/16'
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: pubthis-vpc

  PubThisSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref PubThisVPC
      CidrBlock: '10.0.1.0/24'
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: pubthis-subnet

  PubThisInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: pubthis-igw

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref PubThisVPC
      InternetGatewayId: !Ref PubThisInternetGateway

  PubThisRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref PubThisVPC
      Tags:
        - Key: Name
          Value: pubthis-rt

  PubThisRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PubThisRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref PubThisInternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PubThisSubnet
      RouteTableId: !Ref PubThisRouteTable

  # ---- SECURITY ----

  PubThisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Security group for PubThis server'
      VpcId: !Ref PubThisVPC
      SecurityGroupIngress:
        # Allow HTTP (port 80) from anywhere
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: '0.0.0.0/0'
        # Allow HTTPS (port 443) from anywhere
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: '0.0.0.0/0'
        # Allow SSH (port 22) from your IP
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref YourIP
        # Allow app port (3000) from anywhere
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: '0.0.0.0/0'
      Tags:
        - Key: Name
          Value: pubthis-sg

  # ---- SERVER ----

  PubThisServer:
    Type: AWS::EC2::Instance
    DependsOn: AttachGateway
    Properties:
      InstanceType: t2.micro
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyPairName
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: '0'
          SubnetId: !Ref PubThisSubnet
          GroupSet:
            - !Ref PubThisSecurityGroup
      Tags:
        - Key: Name
          Value: pubthis-server
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          exec > /var/log/pubthis-setup.log 2>&1

          # Update system
          apt-get update -y
          apt-get upgrade -y

          # Install Node.js 22 LTS
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs

          # Install Git
          apt-get install -y git

          # Install PM2 (keeps your app running forever)
          npm install -g pm2

          # Clone YOUR repository
          cd /home/ubuntu
          sudo -u ubuntu git clone https://github.com/RyanChen1002/RyanChen-pubthis.git
          cd RyanChen-pubthis

          # Install dependencies
          sudo -u ubuntu npm install

          # Start the app with PM2 as the ubuntu user
          sudo -u ubuntu pm2 start npm --name "pubthis" -- run start
          sudo -u ubuntu pm2 save
          env PATH=$PATH:/usr/bin pm2 startup systemd -u ubuntu --hp /home/ubuntu

          # Install Nginx as a reverse proxy (maps port 80 -> 3000)
          apt-get install -y nginx
          cat > /etc/nginx/sites-available/pubthis <<'EOF'
          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_cache_bypass $http_upgrade;
              }
          }
          EOF

          ln -sf /etc/nginx/sites-available/pubthis /etc/nginx/sites-enabled/pubthis
          rm -f /etc/nginx/sites-enabled/default
          systemctl restart nginx

  # Elastic IP - Permanent public IP address
  PubThisElasticIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc
      InstanceId: !Ref PubThisServer
      Tags:
        - Key: Name
          Value: pubthis-ip

Outputs:
  PublicIP:
    Description: 'Your PubThis server public IP address'
    Value: !Ref PubThisElasticIP
  
  WebsiteURL:
    Description: 'Your PubThis website URL'
    Value: !Sub 'http://${PubThisElasticIP}'
  
  SSHCommand:
    Description: 'SSH command to connect to your server'
    Value: !Sub 'ssh -i your-key.pem ubuntu@${PubThisElasticIP}'
